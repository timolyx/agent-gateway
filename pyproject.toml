[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gateway"
version = "0.1.0"
description = "把 WorkBuddy / CodeBuddy 订阅模型暴露为本地 OpenAI 兼容 API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "agent-gateway contributors" }]
keywords = ["workbuddy", "codebuddy", "openai", "api", "bridge", "llm", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# 唯一硬依赖：腾讯官方发布的 codebuddy-agent-sdk。
# 它自带跨平台 headless CLI 二进制，并内置浏览器 OAuth 登录流程，
# 因此本项目不预置、不分发任何账号凭证。
dependencies = [
    "codebuddy-agent-sdk>=0.3.299",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/timolyx/agent-gateway"
Repository = "https://github.com/timolyx/agent-gateway.git"
Issues = "https://github.com/timolyx/agent-gateway/issues"

[project.scripts]
agent-gateway = "wbapi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wbapi = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
