name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装
        # 测试是纯离线的，用 --no-deps 避免下载体积较大的官方 SDK。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install "pytest>=8"

      - name: 运行测试
        run: python -m pytest

  build:
    name: 构建包并检查元数据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装构建工具
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: 构建 sdist 与 wheel
        run: python -m build

      - name: 校验包元数据
        run: python -m twine check dist/*

  secret-scan:
    name: 凭证泄漏检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 扫描疑似凭证
        shell: bash
        run: |
          set -euo pipefail
          # 只匹配 token 本体特征（JWT 片段 / 长十六进制串），
          # 不匹配凭证文件名——源码里合法地引用了它。
          PATTERN='eyJ[A-Za-z0-9_-]{20,}|[0-9a-fA-F]{48,}'
          if git grep -nIE "$PATTERN"; then
            echo "::error::检测到疑似凭证内容，请检查上方行"
            exit 1
          fi
          echo "未发现疑似凭证"
